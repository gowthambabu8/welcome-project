name: Anatomy
on:
    workflow_dispatch:
        inputs:
            environment:
                description: "Target environment"
                required: true
                type: choice
                options:
                    - DEV
                    - PROD
    push:
        branches: ["main"]
        paths:
            - "src/**"
    pull_request: 
        branches: ["main"]
        types: ["opened","synchronize","reopened"]
env: 
    NAME: ${{ vars.REPO_NAME }}
    APP_ENV: ${{ inputs.environment }}
    REPORT_REQUIRED: True
jobs:
    print_message:
        runs-on: ubuntu-latest
        steps:
            - run: |
                echo "Hello World"
    variables:
        runs-on: ubuntu-slim
        environment: ${{ inputs.environment }}
        env: 
            NAME: ${{ vars.REPO_NAME }}
        steps:
            - run: |
                echo $NAME
                echo "printing env variables for $APP_ENV ${{ vars.REQUIRED }}"
                echo $APP_ENV ${{ vars.REQUIRED }}
                echo "Report required "
                echo $REPORT_REQUIRED