name: cache
on: [push,pull_request,workflow_dispatch]
defaults:
    run:
        working-directory: node-app
jobs:
    package-basic:
        runs-on: ubuntu-latest
        steps:
            - name: code checkout
              uses: actions/checkout@v4
            - name: node setup
              uses: actions/setup-node@v4
              with:
                node-version: 20
            - name: cache npm packages
              id: cache-packg
              uses: actions/cache@v4
              with:
                path: ~/.npm
                key: ${{runner.os}}node-${{hashFiles('node-app/package-lock.json')}}
            - name: show the computed key
              run: |
                echo "Cache hit :: ${{steps.cache-packg.outputs.cache-hit}}"
                echo "lock file hash :: ${{ hashFiles('node-app/package-lock.json') }}"
            - run: npm ci
            - run: npm test
    
    package-restore-keys:
        runs-on: ubuntu-latest
        steps:
            - name: code checkout
              uses: actions/checkout@v4
            - name: node setup
              uses: actions/setup-node@v4
              with:
                node-version: 20
            - name: cache npm packages
              id: cache-packg
              uses: actions/cache@v4
              with:
                path: ~/.npm
                key: ${{runner.os}}node-${{hashFiles('node-app/package-lock.json')}}
                restore-keys:
                    ${{runner.os}}node-
            - name: check if existing key or restored key
              run: |
                if [ "${{steps.cache-packg.outputs.cache-hit}}" == "true" ]; then 
                    echo "Key found. Using existing key"
                    echo "Cache hit :: ${{steps.cache-packg.outputs.cache-hit}}"
                    echo "lock file hash :: ${{ hashFiles('node-app/package-lock.json') }}"
                else
                    echo "No key found. Keys restored"
                fi
                
            - run: npm ci
            - run: npm test