name: Expressions
on: [push,pull_request]
jobs:
    test:
        runs-on: ubuntu-slim
        outputs:
          coverage: ${{ steps.cov.outputs.value }}
        steps:
            - run: echo ${{github.ref}}
            - if: github.ref == 'refs/heads/main'
              run: echo "Running code from main branch"
            
            - if: github.event_name != 'pull_request'
              run: echo "This is direct commit"

            - if: github.run_attempt > 1
              run: echo "This is attempt ${{github.run_attempt}}"
            
            - name: static coverage report
              id: cov
              run: echo "value=80" >> "$GITHUB_OUTPUT"
    
    build:
        runs-on: ubuntu-slim
        needs: test
        steps:
            - name: check coverage score
              if: fromJSON(needs.test.outputs.coverage) >= 80
              run: echo "coverage gate passed"
    
    string_checks:
        runs-on: ubuntu-latest
        steps:
            - name: contains method
              if: contains(github.event.head_commit.message, '[skips-test]')
              run: echo "skipping tests execution"

            - name: startsWith method
              if: startsWith(github.ref, 'refs/heads/main')
              run: echo "Deploying feature branch"
            
            - name: endsWith method
              if: endsWith(github.ref_name, 'hotfix')
              run: echo "It belongs to hotfix branch"
    
    status_checks:
        runs-on: ubuntu-latest
        steps:
            - if: success()
              run: echo "Deploying code"
            
            - if: failure()
              id: failed_step
              run: echo "Failed to deploy"
            
            - if: steps.failed_step.outcome == 'skipped'
              run: echo "Previous step failed to deploy... Aborting"

            - run: echo ${{ steps.failed_step.outcome }}